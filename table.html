<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>對戰計數 — Marvel Hero Rush</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Teko:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/table.css" />
</head>
<body class="table-body" data-side="a">
  <div id="frame" class="table-frame">
  <div id="orient" class="table-orient">
  <div id="stage" class="table-stage" data-side="a">
    <header class="table-bar">
      <a class="table-back" href="index.html" data-i18n="tableBack">返回</a>
      <div class="table-turn">
        <p id="table-side" class="table-side">紅方</p>
        <p class="table-your" data-i18n="tableYourTurn">你的回合</p>
      </div>
      <button type="button" id="btn-orient" class="table-orient-btn" aria-pressed="false">
        <span class="orient-kicker" data-i18n="tableOrientKicker">顯示</span>
        <span id="orient-label" class="orient-name">直向</span>
      </button>
    </header>
    <p class="table-hint" data-i18n="tableHint">只作計數，不判定規則。已使用的項目可再按一次改回。</p>
    <div class="table-board">
      <div id="table-calls" class="table-calls">
        <button type="button" class="slot-btn" data-call="0" aria-pressed="false">
          <span class="slot-name">Call 1</span>
          <span class="slot-state">未使用</span>
        </button>
        <button type="button" class="slot-btn" data-call="1" aria-pressed="false">
          <span class="slot-name">Call 2</span>
          <span class="slot-state">未使用</span>
        </button>
        <button type="button" class="slot-btn" data-call="2" aria-pressed="false">
          <span class="slot-name">Call 3</span>
          <span class="slot-state">未使用</span>
        </button>
      </div>
      <button type="button" id="btn-base" class="slot-btn base-btn" aria-pressed="false">
        <span class="slot-name" data-i18n="tableBase">基地部署</span>
        <span class="slot-state">本回合未使用</span>
      </button>
      <button type="button" id="btn-end" class="end-btn">
        <span class="end-name" data-i18n="tableEnd">結束回合</span>
        <span class="end-sub" data-i18n="tableEndSub">重置並轉向對手</span>
      </button>
    </div>
    <p id="table-live" class="sr-only" aria-live="polite"></p>
  </div>
  </div>
  </div>
  <script src="js/i18n.js?v=1.6.15-beta"></script>
  <script src="js/table.js"></script>
</body>
</html>
