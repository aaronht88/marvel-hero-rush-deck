<!DOCTYPE html>
<html lang="zh-HK" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>對戰助手 — Marvel Hero Rush</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Teko:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/table.css?v=1.6.21-beta.5" />
</head>
<body class="table-body" data-side="a">
  <div id="frame" class="table-frame">
  <div id="orient" class="table-orient">
  <div id="stage" class="table-stage" data-side="a">
    <header class="table-bar">
      <div class="table-bar-start">
        <a class="table-back" href="index.html" data-i18n="tableBack">返回</a>
        <button type="button" id="btn-clear" class="table-clear-btn">
          <span data-i18n="tableClear">清空</span>
        </button>
      </div>
      <div class="table-turn">
        <p id="table-side" class="table-side">紅方</p>
        <p id="table-turn-label" class="table-your" data-i18n="tablePreGame">開局</p>
      </div>
      <button type="button" id="btn-orient" class="table-orient-btn" aria-pressed="false">
        <span class="orient-kicker" data-i18n="tableOrientKicker">顯示</span>
        <span id="orient-label" class="orient-name">直向</span>
      </button>
    </header>
    <div class="table-clocks-wrap">
      <p id="table-clock-caption" class="table-clock-caption" data-i18n="tableClockGroup">累計用時</p>
      <div id="table-clocks" class="table-clocks" role="group" aria-labelledby="table-clock-caption">
        <div class="clock" data-clock="a" role="timer">
          <span class="clock-meta">
            <span class="clock-name">紅方</span>
            <span class="clock-status"></span>
          </span>
          <span class="clock-time">00:00</span>
        </div>
        <div class="clock" data-clock="b" role="timer">
          <span class="clock-meta">
            <span class="clock-name">藍方</span>
            <span class="clock-status"></span>
          </span>
          <span class="clock-time">00:00</span>
        </div>
      </div>
    </div>
    <p id="table-hint" class="table-hint" data-i18n="tableDrawHint">輕按金幣抽先後攻。計時於首次 Call 或基地部署時才開始。</p>
    <div id="table-draw" class="table-draw" data-toss="idle">
      <div class="coin-scene" id="coin-scene" aria-hidden="true">
        <div class="coin-shadow" id="coin-shadow"></div>
        <div class="coin" id="coin">
          <div class="coin-face coin-front">
            <span class="coin-label" lang="en">FIRST</span>
          </div>
          <div class="coin-face coin-back">
            <span class="coin-label" lang="en">SECOND</span>
          </div>
        </div>
      </div>
      <button type="button" id="btn-draw" class="draw-btn">
        <span class="draw-copy">
          <span class="draw-name" data-i18n="tableDraw">抽先後攻</span>
          <span class="draw-sub" data-i18n="tableDrawSub">輕按擲幣。正面為先攻，背面為後攻。</span>
        </span>
      </button>
    </div>
    <div class="table-board" id="table-board" hidden>
      <div id="table-calls" class="table-calls">
        <button type="button" class="slot-btn" data-call="0" aria-pressed="false">
          <span class="slot-name">Call 1</span>
          <span class="slot-state">未使用</span>
        </button>
        <button type="button" class="slot-btn" data-call="1" aria-pressed="false">
          <span class="slot-name">Call 2</span>
          <span class="slot-state">未使用</span>
        </button>
        <button type="button" class="slot-btn" data-call="2" aria-pressed="false">
          <span class="slot-name">Call 3</span>
          <span class="slot-state">未使用</span>
        </button>
      </div>
      <button type="button" id="btn-base" class="slot-btn base-btn" aria-pressed="false">
        <span class="slot-name" data-i18n="tableBase">基地部署</span>
        <span class="slot-state">本回合未使用</span>
      </button>
      <button type="button" id="btn-end" class="end-btn">
        <span class="end-name" data-i18n="tableEnd">結束回合</span>
        <span class="end-sub" data-i18n="tableEndSub">重置並轉向對手</span>
      </button>
    </div>
    <p id="table-live" class="sr-only" aria-live="polite"></p>
  </div>
  </div>
  </div>
  <script src="js/i18n.js?v=1.6.21-beta.5"></script>
  <script src="js/table.js?v=1.6.21-beta.5"></script>
</body>
</html>
