name: Update news

on:
  schedule:
    - cron: "17 1 * * *"   # daily 09:17 HKT
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        run: python3 scripts/fetch_news.py
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "chore(news): auto-update news.json"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # pushes made with GITHUB_TOKEN don't trigger other workflows, so kick the Pages deploy explicitly
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
