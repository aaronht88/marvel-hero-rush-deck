<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marvel Hero Rush TCG — Deck Builder</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚡</span>
      <div>
        <h1>Marvel Hero Rush <small>Deck Builder</small></h1>
        <p class="subtitle" data-i18n="subtitle">233 張實卡資料（BP01 The Avengers + SD01-04 預組）· 官方 cardlist</p>
      </div>
    </div>
    <div class="top-actions">
      <label class="lang-wrap">
        <span data-i18n="langLabel">語言</span>
        <select id="lang-select">
          <option value="zh-HK">繁體中文</option>
          <option value="zh-CN">简体中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <button id="btn-export" class="btn" data-i18n="exportBtn">匯出 Deck (JSON)</button>
      <button id="btn-import" class="btn" data-i18n="importBtn">匯入 Deck</button>
      <button id="btn-share" class="btn" data-i18n="shareBtn">複製分享碼</button>
      <button id="btn-clear" class="btn btn-danger" data-i18n="clearBtn">清空</button>
      <input type="file" id="file-import" accept="application/json" hidden />
    </div>
  </header>

  <main class="layout">
    <!-- LEFT: card browser -->
    <section class="browser">
      <div class="controls">
        <input type="text" id="search" data-i18n-ph="searchPh" placeholder="搜尋卡名 / 編號 / 特徵 / 效果…" />
        <select id="filter-set" data-i18n-first="allSeries">
          <option value="">全部系列</option>
        </select>
        <select id="filter-rarity" data-i18n-first="allRarity">
          <option value="">全部稀有度</option>
        </select>
        <select id="filter-level" data-i18n-first="allLevel">
          <option value="">全部等級</option>
        </select>
        <select id="filter-range" data-i18n-first="allRange">
          <option value="">全部攻擊範圍</option>
        </select>
        <select id="filter-attr" data-i18n-first="allColor">
          <option value="">全部顏色</option>
        </select>
        <label class="fav-toggle">
          <input type="checkbox" id="filter-fav" />
          <span data-i18n="favOnly">只睇最愛</span>
        </label>
      </div>
      <div id="card-grid" class="card-grid"><!-- cards injected --></div>
    </section>

    <!-- RIGHT: deck panel (drag & drop target) -->
    <aside class="deck-panel" id="deck-panel">
      <div class="deck-header">
        <h2 data-i18n="deckTitle">Deck</h2>
        <span id="deck-count" class="deck-count">0 張</span>
      </div>

      <div id="deck-validation" class="validation"><!-- rules status --></div>

      <div class="deck-stats" id="deck-stats"><!-- stat chips --></div>

      <div id="deck-list" class="deck-list"><!-- deck rows --></div>

      <div class="share-box">
        <label data-i18n="shareLabel">分享碼 / 匯入貼上：</label>
        <textarea id="share-text" rows="3" data-i18n-ph="sharePh" placeholder="點「複製分享碼」生成，或貼上別人嘅碼再點匯入…"></textarea>
      </div>
    </aside>
  </main>

  <!-- CARD DETAIL OVERLAY -->
  <div id="card-modal" class="modal-overlay" hidden>
    <div class="modal">
      <button id="modal-close" class="modal-close" aria-label="close">×</button>
      <div class="modal-body">
        <div class="modal-art-wrap">
          <img id="modal-art" src="" alt="" />
        </div>
        <div class="modal-info">
          <div class="modal-no" id="modal-no"></div>
          <h2 class="modal-name" id="modal-name"></h2>
          <div class="modal-chips" id="modal-chips"></div>
          <dl class="modal-details">
            <div><dt data-i18n="lvLabel">等級</dt><dd id="modal-level"></dd></div>
            <div><dt data-i18n="powerLabel">戰力</dt><dd id="modal-power"></dd></div>
            <div><dt data-i18n="rangeLabel">攻擊範圍</dt><dd id="modal-range"></dd></div>
            <div><dt data-i18n="attrLabel">顏色</dt><dd id="modal-attr"></dd></div>
            <div><dt data-i18n="featureLabel">特徵</dt><dd id="modal-feature"></dd></div>
            <div><dt data-i18n="rarityLabel">稀有度</dt><dd id="modal-rarity"></dd></div>
            <div><dt data-i18n="setLabel">系列</dt><dd id="modal-set"></dd></div>
          </dl>
          <div class="modal-effect">
            <div class="modal-effect-label" data-i18n="effectLabel">效果</div>
            <div id="modal-effect-text"></div>
          </div>
          <div class="modal-actions">
            <button id="modal-add-deck" class="btn btn-primary" data-i18n="addDeckBtn">加入 Deck</button>
            <button id="modal-fav" class="btn">☆ 加入最愛</button>
            <div class="deck-ctl">
              <span data-i18n="inDeckLabel">在 Deck 內</span>
              <button id="deck-dec" class="btn">−</button>
              <span id="deck-count-modal">0</span>
              <button id="deck-inc" class="btn">+</button>
            </div>
            <div class="owned-ctl">
              <span data-i18n="ownedLabel">我已擁有</span>
              <button id="owned-dec" class="btn">−</button>
              <span id="owned-count">0</span>
              <button id="owned-inc" class="btn">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- data + logic -->
  <script src="js/i18n.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
